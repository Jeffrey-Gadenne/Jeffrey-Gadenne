# Deploys device-diagnostics/ to Azure App Service — no credentials ever shared in chat.
#
# One-time setup:
#   1. Create the app once (locally): see device-diagnostics/DEPLOY.md (az webapp up ...)
#   2. In the Azure Portal: your App Service → Overview → "Download publish profile"
#   3. In this repo: Settings → Secrets and variables → Actions → New repository secret
#        Name:  AZURE_WEBAPP_PUBLISH_PROFILE   Value: (paste the file contents)
#   4. Set the app name below.
#
# After that, every push to main that touches device-diagnostics/ auto-deploys,
# and you can trigger a deploy manually from the Actions tab.

name: Deploy Device Diagnostics to Azure

on:
  push:
    branches: [main]
    paths: ["device-diagnostics/**"]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: YOUR-APP-NAME   # <-- set to your App Service name

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install production dependencies
        working-directory: device-diagnostics
        run: npm ci --omit=dev

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: device-diagnostics
